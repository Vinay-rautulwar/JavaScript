<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic JSON Table Render</title>
    <!-- Include jQuery via CDN for the jQuery example -->
    <script src="https://jquery.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <span class="badge">Experiment 10</span>
        <h1>Dynamic JSON Table Rendering</h1>
    </header>

    <main>
        <section class="panel">
            <h2>Data Loaded via Native fetch()</h2>
            <table id="fetch-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="fetch-tbody"><!-- Data will inject here --></tbody>
            </table>
        </section>

        <section class="panel">
            <h2>Data Loaded via jQuery $.getJSON()</h2>
            <table id="jquery-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="jquery-tbody"><!-- Data will inject here --></tbody>
            </table>
        </section>
    </main>

    <footer class="site-footer">
        <p>JavaScript Lab Experiment &middot; <strong>Vinay Rautulwar</strong></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
